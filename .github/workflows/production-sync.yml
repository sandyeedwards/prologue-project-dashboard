name: Production Teamwork sync
run-name: "Production sync - ${{ github.event_name }} - ${{ github.event.schedule || 'manual' }}"

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"
      timezone: "America/New_York"

    - cron: "0 16 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: production-teamwork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      TEAMWORK_TOKEN_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_TEAMWORK_TOKEN_ENCRYPTION_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$TEAMWORK_TOKEN_ENCRYPTION_KEY"

      - name: Check production database
        run: npm run db:check

      - name: Synchronize production Teamwork data
        run: npm run job:nightly-sync
