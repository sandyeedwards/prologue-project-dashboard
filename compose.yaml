services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prologue_dashboard
      POSTGRES_USER: prologue
      POSTGRES_PASSWORD: prologue_local_only
    ports:
      - "5432:5432"
    volumes:
      - prologue_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prologue -d prologue_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prologue_postgres_data:
